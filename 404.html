<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stormwindsky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090a0f;
            --card-bg: #14171f;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #007aff;
            --border: rgba(255, 255, 255, 0.08);
        }

        .blood-theme {
            --bg-body: #0d0202;
            --card-bg: #1a0505;
            --text-main: #fff5f5;
            --text-muted: #feb2b2;
            --accent: #e53e3e;
            --border: rgba(229, 62, 62, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-home {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 16px;
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease, background 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Easter Egg Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(13, 2, 2, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            position: relative;
            background: #1a0505;
            border: 2px solid #e53e3e;
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 25px 60px rgba(229, 62, 62, 0.4);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #e53e3e;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .modal-close:hover {
            transform: scale(1.1);
            background: #c53030;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Prevents interaction with iframe */
        }
    </style>
</head>
<body>

    <div class="error-card" id="errorCard">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Oops! The page you are looking for doesn't exist or has been moved to another dimension.</p>
        <a href="main.html" class="btn-home">Return to Main</a>
    </div>

    <!-- Easter Egg Modal -->
    <div id="easterEggModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeEasterEgg()" aria-label="Close">✕</button>
            <div class="video-wrapper">
                <!-- Looping YouTube video via embed parameters -->
                <iframe id="eggVideo" src="" title="Easter Egg" allow="autoplay"></iframe>
            </div>
        </div>
    </div>

    <script>
        function closeEasterEgg() {
            document.getElementById('easterEggModal').classList.remove('active');
            // Stop video playback by clearing src
            document.getElementById('eggVideo').src = '';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = window.location.href;
            if (urlParams.includes('666')) {
                // Apply blood red horror theme
                document.documentElement.classList.add('blood-theme');
                document.getElementById('errorCard').style.borderColor = '#e53e3e';
                
                // Trigger modal with looping video (autoplay enabled with mute for browser compliance)
                const videoId = 'a2Gvb9iSRgs';
                const iframeSrc = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&disablekb=1&modestbranding=1`;
                
                document.getElementById('eggVideo').src = iframeSrc;
                document.getElementById('easterEggModal').classList.add('active');
            }
        });
    </script>
</body>
</html>
